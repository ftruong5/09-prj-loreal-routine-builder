<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oréal Logo" class="logo" />
        <h1 class="site-title">Smart Routine &amp; Product Advisor</h1>
      </header>

      <!-- Category Filter -->
      <div class="search-section">
        <div class="custom-select" id="categoryDropdown">
          <button type="button" class="select-trigger" id="categoryTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="categoryTriggerText">Choose a Category</span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="select-options" id="categoryOptions" role="listbox" hidden>
            <li role="option" data-value="cleanser" tabindex="-1">Cleansers</li>
            <li role="option" data-value="moisturizer" tabindex="-1">Moisturizers &amp; Treatments</li>
            <li role="option" data-value="haircare" tabindex="-1">Haircare</li>
            <li role="option" data-value="makeup" tabindex="-1">Makeup</li>
            <li role="option" data-value="hair color" tabindex="-1">Hair Color</li>
            <li role="option" data-value="hair styling" tabindex="-1">Hair Styling</li>
            <li role="option" data-value="men's grooming" tabindex="-1">Men's Grooming</li>
            <li role="option" data-value="suncare" tabindex="-1">Suncare</li>
            <li role="option" data-value="fragrance" tabindex="-1">Fragrance</li>
          </ul>
        </div>
      </div>

      <!-- Products Grid -->
      <div id="productsContainer" class="products-grid"></div>

      <!-- Selected Products -->
      <div class="selected-products">
        <h2>Selected Products</h2>
        <div id="selectedProductsList"></div>
        <div class="selected-actions">
          <button id="clearSelected" class="clear-btn" type="button">
            <i class="fa-solid fa-trash"></i> Clear all
          </button>
          <button id="generateRoutine" class="generate-btn">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Routine
          </button>
        </div>
      </div>

      <!------- Chat Area ------->
      <section class="chatbox">
        <h2>Let's Build Your Routine</h2>
        <div id="chatWindow" class="chat-window"></div>

        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">Message</label>
          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask me about products or routines…"
            autocomplete="off"
            required
          />
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
            <span class="visually-hidden">Send</span>
          </button>
        </form>
      </section>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
